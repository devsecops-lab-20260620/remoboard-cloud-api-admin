name: CI — Quality Gate

on:
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  # ── ① Lint / Static Analysis ─────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy bandit[toml] pydantic pydantic-settings

      - name: ruff lint
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy app/

      - name: bandit (security scan)
        run: bandit -r app/ -c pyproject.toml -ll

  # ── ② Unit Tests (no DB) ─────────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.xml

  # ── ③ Integration Tests (real PostgreSQL) ────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remoboard_admin
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: remoboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remoboard_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://remoboard_admin:test-password@localhost:5432/remoboard_test
      ADMIN_AUTH_USERNAME: test-admin
      ADMIN_AUTH_PASSWORD: test-pass
      ADMIN_AUTH_JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest tests/integration/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: coverage.xml

  # ── ④ E2E Tests ───────────────────────────────────────────────────────────
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs:
      - unit-test
      - integration-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remoboard_admin
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: remoboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remoboard_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://remoboard_admin:test-password@localhost:5432/remoboard_test
      ADMIN_AUTH_USERNAME: test-admin
      ADMIN_AUTH_PASSWORD: test-pass
      ADMIN_AUTH_JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run E2E tests
        run: pytest tests/e2e/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: coverage.xml

