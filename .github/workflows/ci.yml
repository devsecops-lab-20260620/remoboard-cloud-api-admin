name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-cov pytest-asyncio httpx
      - run: pytest tests/unit/ -v

  integration-test:
    runs-on: ubuntu-latest
    needs: unit-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remoboard_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: remoboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remoboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://remoboard_test:test-password@localhost:5432/remoboard_test
      DATABASE_URL: postgresql://remoboard_test:test-password@localhost:5432/remoboard_test
      ADMIN_AUTH_USERNAME: test-admin
      ADMIN_AUTH_PASSWORD: test-pass
      ADMIN_AUTH_JWT_SECRET: ci-test-secret
      ADMIN_AUTH_ISSUER: test-issuer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-cov pytest-asyncio httpx
      - run: alembic upgrade head
      - run: pytest tests/integration/ tests/e2e/ -v
