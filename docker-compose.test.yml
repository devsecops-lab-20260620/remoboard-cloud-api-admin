# docker-compose.test.yml — local integration & E2E test runner
# Usage:
#   docker compose -f docker-compose.test.yml up --build --exit-code-from api-test
#
# The TEST_DATABASE_URL is wired to the postgres service automatically.

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remoboard_test
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: remoboard_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remoboard_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql://remoboard_test:test-password@postgres:5432/remoboard_test
      DATABASE_URL: postgresql://remoboard_test:test-password@postgres:5432/remoboard_test
      ADMIN_AUTH_USERNAME: test-admin
      ADMIN_AUTH_PASSWORD: test-pass
      ADMIN_AUTH_JWT_SECRET: local-test-secret
      ADMIN_AUTH_ISSUER: test-issuer
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m pytest tests/ -v --cov=app --cov-report=term-missing"
